<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicky</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* The BrowserWindow uses transparent:true — every DOM layer must also
         be transparent so the OS compositor shows what is behind the window. */
      html,
      body,
      #root {
        background: transparent !important;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      /* Prevent accidental drag gestures on the frameless window */
      body {
        -webkit-app-region: no-drag;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/notch.tsx"></script>
  </body>
</html>
